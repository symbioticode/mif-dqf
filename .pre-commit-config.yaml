repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: ["--profile", "black"]
      
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
        args: ["--fix", "--exit-zero"]
