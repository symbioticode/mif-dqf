[pytest]
# Pytest configuration for DQF

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude backup directories and cache
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    htmlcov
    .venv
    venv
    *.backup*
    backup_*

# Coverage options
addopts = 
    --cov=dqf
    --cov-report=html
    --cov-report=term-missing
    --verbose

# Markers (for future use)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Warnings
filterwarnings =
    # Ignore specific warnings if needed
    # error::DeprecationWarning